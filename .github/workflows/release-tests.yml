# Repository-specific: runs the redaction tests in an optimized build. The time limits are only
# checked there, and the peak-memory and large-probe suites take about three minutes each in a
# debug build on a laptop; with them a hosted runner cannot finish the shared SwiftPM job in its
# 30 minutes. ci.yml skips those two suites and this job runs them.
name: Release tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  redaction:
    name: Redaction (release build)
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test -c release --no-parallel --filter Redaction
