# Managed by the repository kit (muhittincamdali/.github). Edit the inputs, keep the structure.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  swift:
    permissions:
      contents: read
    uses: muhittincamdali/.github/.github/workflows/swift-ci.yml@85ec2fa95f3607e09168f14b744bd3154fdc7d43 # v1.1.0
    with:
      platforms: '["iOS","macOS","tvOS","watchOS","visionOS"]'
      test-on-simulator: true
      # The memory and large-probe suites run in release-tests.yml: with them, a serial debug run
      # takes about 35 minutes on a hosted runner, and this job stops after 30.
      swift-test-flags: --no-parallel --skip RedactionPeakMemoryTests --skip RedactionReviewProbeSetTests
